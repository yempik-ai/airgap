# Static checks and the offline tests. Nothing here downloads weights or starts
# a server: the tests read captured answers (tests/fixtures/) and this Mac's
# memory (bin/env.sh), which is why they run on the macOS runner.
#
# This repository is public, and GitHub-hosted runners (Ubuntu and macOS) are
# free for public repositories, so this runs on every push and pull request.
# Two guards keep a run from ever hanging or piling up: each job is capped at
# ten minutes (MEASURED on run 32121837232: 17 s for lint, 11 s for the tests),
# and a new push cancels the run it supersedes. Actions are pinned at a major
# that declares Node 24; Node 20 is deprecated on GitHub-hosted runners.
#
# The same two jobs, locally:
#     bash -n start.sh bin/*.sh harness/*.sh tests/*.sh && shellcheck -S warning start.sh bin/*.sh harness/*.sh tests/*.sh
#     bash tests/run.sh
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: shellcheck and bash -n
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: bash -n
        run: bash -n start.sh bin/*.sh harness/*.sh tests/*.sh
      - name: shellcheck (warning and above)
        run: shellcheck -S warning start.sh bin/*.sh harness/*.sh tests/*.sh

  tests:
    name: offline tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run tests
        run: bash tests/run.sh
