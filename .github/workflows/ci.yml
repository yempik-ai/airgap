# Static checks and the offline tests. Nothing here downloads weights or starts
# a server: the tests read captured answers (tests/fixtures/) and this Mac's
# memory (bin/env.sh), which is why they run on the macOS runner.
#
# Manual trigger only, on purpose: it has never run on GitHub, and it should
# not start costing anything without a maintainer choosing to. This repository
# is public, and GitHub-hosted runners (Ubuntu and macOS) are free for public
# repositories; if that is still true when you read this, replace the `on:`
# block with
#     on:
#       push:
#         branches: [main]
#       pull_request:
# and it runs on every push. Until then: Actions tab -> ci -> Run workflow.
# The same two jobs, locally:
#     bash -n start.sh bin/*.sh tests/*.sh && shellcheck -S warning start.sh bin/*.sh tests/*.sh
#     bash tests/run.sh
name: ci

on:
  workflow_dispatch:

jobs:
  lint:
    name: shellcheck and bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: bash -n
        run: bash -n start.sh bin/*.sh tests/*.sh
      - name: shellcheck (warning and above)
        run: shellcheck -S warning start.sh bin/*.sh tests/*.sh

  tests:
    name: offline tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: bash tests/run.sh
