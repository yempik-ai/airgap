<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="airgap — an air-gapped Claude Code. Run an abliterated Qwen3.8-27B entirely on your own Mac.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E35B2D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E35B2D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="440" fill="url(#bg)"/>

  <!-- the air gap: everything real happens inside this boundary -->
  <rect x="60" y="60" width="1000" height="320" rx="14"
        fill="none" stroke="#E35B2D" stroke-opacity="0.45"
        stroke-width="2" stroke-dasharray="10 8"/>
  <text x="80" y="92" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="15" fill="#E35B2D" fill-opacity="0.85" letter-spacing="2.5">YOUR MAC</text>

  <text x="80" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-1">airgap</text>

  <rect x="82" y="222" width="300" height="3" fill="url(#rule)"/>

  <text x="80" y="272" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="27" font-weight="600" fill="#E5E7EB">An air-gapped Claude Code.</text>

  <text x="80" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="19" fill="#9CA3AF">Run an abliterated Qwen3.8-27B entirely on your own Apple Silicon Mac.</text>

  <text x="80" y="345" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="16" fill="#6B7280">MLX · 2/4/5/6/8-bit · no API key · no account · no network</text>

  <!-- the severed link: request leaves Claude Code, never leaves the box -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">
    <rect x="830" y="120" width="200" height="52" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="930" y="151" fill="#E5E7EB" text-anchor="middle">Claude Code</text>

    <path d="M930 172 L930 214" stroke="#E35B2D" stroke-width="2"/>
    <polygon points="930,222 925,212 935,212" fill="#E35B2D"/>
    <text x="948" y="200" fill="#6B7280" font-size="13">127.0.0.1</text>

    <rect x="830" y="222" width="200" height="52" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="930" y="253" fill="#E5E7EB" text-anchor="middle">mlx-serve</text>

    <path d="M930 274 L930 316" stroke="#E35B2D" stroke-width="2"/>
    <polygon points="930,324 925,314 935,314" fill="#E35B2D"/>

    <rect x="830" y="324" width="200" height="52" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="930" y="355" fill="#E5E7EB" text-anchor="middle">MLX / Metal</text>
  </g>

  <!-- the internet, on the far side of the gap, unreachable -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">
    <text x="1150" y="152" fill="#4B5563" text-anchor="middle">the</text>
    <text x="1150" y="172" fill="#4B5563" text-anchor="middle">internet</text>
    <path d="M1060 240 L1108 240" stroke="#4B5563" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M1118 224 L1134 256 M1134 224 L1118 256" stroke="#EF4444" stroke-width="2.5"/>
    <text x="1150" y="292" fill="#4B5563" text-anchor="middle">never</text>
    <text x="1150" y="310" fill="#4B5563" text-anchor="middle">reached</text>
  </g>

  <text x="1220" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="15" fill="#6B7280" text-anchor="end">built by yempik.</text>
</svg>
